name: Build jobs
run-name:
on:
  push:
    paths:
      - 'src/**'
      - 'lib/**'
      - '3rd_party/**'
      - '.github/workflows/**'
      - 'CMakeLists.txt'
  pull_request:
    branches:
      - master
  release:
    types: [published]

jobs:
  build-develop-linux:
    # Sweep the full gcc/clang spectrum on a single Ubuntu 22.04 host. Older
    # ubuntu-22.04 apt deps (Boost 1.74, oneTBB 2021.5, Eigen 3.4) are the most
    # constrained set the codebase needs to build against. Cross-distro builds
    # are covered by the separate build-from-source-linux job below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, compiler: gcc-11 }
          - { os: ubuntu-22.04, compiler: gcc-12 }
          - { os: ubuntu-22.04, compiler: gcc-13 }
          - { os: ubuntu-22.04, compiler: gcc-14 }
          - { os: ubuntu-22.04, compiler: gcc-15 }
          - { os: ubuntu-22.04, compiler: gcc-16 }
          - { os: ubuntu-22.04, compiler: clang-14 }
          - { os: ubuntu-22.04, compiler: clang-15 }
          - { os: ubuntu-22.04, compiler: clang-16 }
          - { os: ubuntu-22.04, compiler: clang-17 }
          - { os: ubuntu-22.04, compiler: clang-18 }
          - { os: ubuntu-22.04, compiler: clang-19 }
          - { os: ubuntu-22.04, compiler: clang-20 }
          - { os: ubuntu-22.04, compiler: clang-21 }
          - { os: ubuntu-22.04, compiler: clang-22 }
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "500M"
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup C++
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          make: true
          ccache: true
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # Per-OS and per-compiler so e.g. gcc-15 doesn't pollute clang-22's cache.
          # Unique run_id suffix means each run produces its own save entry; the
          # prefix-only restore-keys fall back to the most recent older cache.
          key: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.compiler }}-
      - name: "Install dependencies"
        run: |
          sudo apt-get update && sudo apt-get install -y \
          cmake build-essential libboost-test-dev libtbb-dev \
          libarchive-dev libboost-program-options-dev \
          libeigen3-dev liblzma-dev libbz2-dev zlib1g-dev zip
      - name: "Configure"
        run: |
          cmake . -DCMAKE_BUILD_TYPE=Release -DBUILD_DOC=OFF \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: "Build supercell and tests"
        run: cmake --build . -j $(nproc)
      - name: "ccache stats"
        if: always()
        run: ccache -s
      - name: "Smoke test"
        run: 'src/sc_cli/supercell -d -i ./data/examples/Ca2Al2SiO7/Ca2Al2SiO7.cif | grep -q "The total number of combinations is 6"'
      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
  deploy-build-macos:
    strategy:
      fail-fast: false
    runs-on: macos-14
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: "Install brew dependencies"
        run: |
          brew install boost eigen libarchive zlib
      - name: "Get TBB"
        uses: actions/checkout@v6
        with:
          repository: oneapi-src/oneTBB
          ref: v2021.13.0
          path: ./tbb
          submodules: true
      - name: "Compile and install tbb"
        working-directory: ./tbb
        run: |
          cmake . -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DTBB_TEST=OFF
          make -j 4
          sudo make install
      - uses: actions/checkout@v6
        with:
          path: ./supercell
          submodules: true
      - name: "Compile supercell."
        working-directory: ./supercell
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig"
          cmake . -DCMAKE_BUILD_TYPE=Release -DLINK_STATIC_LIBS=ON \
                  -DLibArchive_INCLUDE_DIR=$(brew --prefix libarchive)/include \
                  -DBUILD_DOC=OFF
          make supercell -j $(sysctl -n hw.ncpu)
      - name: "Check supercell"
        working-directory: ./supercell
        run: 'src/sc_cli/supercell -d -i ./data/examples/Ca2Al2SiO7/Ca2Al2SiO7.cif | grep -q "The total number of combinations is 6"'
      - name: "Check supercell dynamic libs."
        working-directory: ./supercell
        run: 'otool -l src/sc_cli/supercell'
      - name: Upload Supercell
        uses: actions/upload-artifact@v7
        with:
          name: macos-bin
          path: ./supercell/src/sc_cli/supercell
  deploy-build-linux:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
      - name: "Clone supercell"
        uses: actions/checkout@v6
        with:
          path: ./supercell
          submodules: true
      - name: "Clone oneTBB"
        uses: actions/checkout@v6
        with:
          repository: oneapi-src/oneTBB
          ref: v2021.13.0
          path: ./oneTBB
          submodules: true
      - name: "Compile supercell with deps"
        uses: addnab/docker-run-action@v3
        with:
          image: ubuntu:20.04
          options: -v ${{ github.workspace }}:/work
          run: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get full-upgrade -y
            apt-get install -y wget tar zip git cmake software-properties-common \
            libboost-program-options-dev libboost-test-dev \
              liblzma-dev libbz2-dev zlib1g-dev libzstd-dev liblz4-dev
            add-apt-repository -y ppa:ubuntu-toolchain-r/test
            apt-get update
            apt-get install -y gcc-14 g++-14
            export CC=gcc-14
            export CXX=g++-14
            export BASE_DIR=/work
            cd $BASE_DIR
            wget -nv https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.gz -O - | tar -zxf -
            cmake -S eigen-5.0.1 -B eigen-build -DEIGEN_BUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF -DEIGEN_BUILD_BLAS=OFF -DEIGEN_BUILD_LAPACK=OFF
            cmake --install eigen-build
            # oneTBB
            cd $BASE_DIR/oneTBB
            mkdir cmake-build && cd cmake-build
            cmake ../ -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DTBB_TEST=OFF
            make -j $(nproc) && make install
            wget -nv https://github.com/libarchive/libarchive/releases/download/v3.7.4/libarchive-3.7.4.tar.gz -O - | tar -zxf -
            cd libarchive-3.7.4
            ./configure --without-openssl --without-libb2 --without-xml2 --without-expat --disable-bsdtar
            sed -ir '/^.*#define HAVE_LZMA_STREAM_ENCODER_MT 1.*$/d' config.h
            make -j 4
            make install
            cd $BASE_DIR/supercell
            cmake . -DCMAKE_BUILD_TYPE=Release -DLINK_STATIC_LIBS=ON && make supercell -j 4
            $BASE_DIR/supercell/src/sc_cli/supercell -d -i $BASE_DIR/supercell/data/examples/Ca2Al2SiO7/Ca2Al2SiO7.cif | grep -q "The total number of combinations is 6"
      - name: Upload Supercell
        uses: actions/upload-artifact@v7
        with:
          name: linux-bin
          path: ./supercell/src/sc_cli/supercell
  deploy-build-windows:
    runs-on: ubuntu-22.04
    steps:
      - name: "Install dependencies"
        run: |
          sudo apt update && sudo apt -y full-upgrade
          sudo apt install -y gcc cmake build-essential wine-stable autopoint gperf intltool libtool libtool-bin lzip p7zip-full python3 python3-mako
      - name: "Download MXE"
        uses: actions/checkout@v6
        with:
          repository: mxe/mxe
          path: ./mxe
          submodules: true
      - name: Cache
        uses: actions/cache@v4
        with:
          save-always: true
          path: ./mxe/.ccache
          key: win-cache-${{ github.run_id }} # Can use time based key as well
          restore-keys: |
            win-cache-          
      - name: "Compile MXE"
        working-directory: ./mxe
        run: |
          sed -i -r 's/ nettle / /g' src/libarchive.mk && sed -i -r 's/with-nettle/without-nettle --without-openssl --without-iconv /g' src/libarchive.mk
          make MXE_TARGETS=x86_64-w64-mingw32.static MXE_PLUGIN_DIRS=plugins/gcc14 ccache
          echo 'max_size = 15.0G' > .ccache/ccache/ccache.conf
          .ccache/bin/ccache -s 
          make MXE_TARGETS=x86_64-w64-mingw32.static MXE_PLUGIN_DIRS=plugins/gcc14 ccache cc cmake intel-tbb boost eigen libarchive --jobs=4 JOBS=4
          .ccache/bin/ccache -s
          echo "${PWD}/usr/bin" >> $GITHUB_PATH
      - name: "Clone supercell"
        uses: actions/checkout@v6
        with:
          path: ./supercell
          submodules: true
      - name: "Compile Supercell"
        working-directory: ./supercell
        run: |
          x86_64-w64-mingw32.static-cmake . -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_DOC=OFF -DLINK_STATIC_LIBS=ON
          make supercell
      - name: "Run supercell"
        working-directory: ./supercell
        run: 'wine src/sc_cli/supercell.exe -d -i ./data/examples/Ca2Al2SiO7/Ca2Al2SiO7.cif | grep -q "The total number of combinations is 6"'
      - name: Upload Supercell
        uses: actions/upload-artifact@v7
        with:
          name: windows-bin
          path: ./supercell/src/sc_cli/supercell.exe

  deploy-to-site:
    if: github.event_name == 'release'
    needs: [ deploy-build-linux, deploy-build-macos, deploy-build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: "Install dependencies"
        run: |
          sudo apt-get update && sudo apt-get full-upgrade -y
          sudo apt-get update
          sudo apt-get install -y git wget tar openssh-client zip
      - uses: actions/download-artifact@v7
        with:
          name: linux-bin
          path: ./art/linux
      - uses: actions/download-artifact@v7
        with:
          name: windows-bin
          path: ./art/windows
      - uses: actions/download-artifact@v7
        with:
          name: macos-bin
          path: ./art/osx
      - name: "Deploy to file"
        env:
          SITE_REPO_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir ./site && cd ./site
          # Save some useful information
          ART_DIR=${PWD}/../art/
          DEPLOY_REPO="git@github.com:orex/orex.github.io.git"
          DEPLOY_BRANCH="master"
          DEPLOY_DIR="supercell/external"
          #
          mkdir ~/.ssh
          eval `ssh-agent -s`
          echo "${SITE_REPO_KEY}" | ssh-add -
          ssh-keyscan -t rsa github.com > ~/.ssh/known_hosts
          # Clone the existing gh-pages for this repo into out/
          # Create a new empty branch if gh-pages doesn't exist yet (should only happen on first deply)
          git clone --recurse-submodules "${DEPLOY_REPO}" --branch "${DEPLOY_BRANCH}" out && cd out
          REPO_PATH=${PWD}
          # Now let's go have some fun with the cloned repo
          git config user.name "Github Action"
          git config user.email "kirill.okhotnikov@gmail.com"
          #Main code
          mkdir -p "${REPO_PATH}/${DEPLOY_DIR}/exe/."
          cd `mktemp -d -t XXXXXX`
          wget -nv https://github.com/orex/supercell/raw/deploy/README -O README
          for i in ${ART_DIR}/*
          do
            cp -a "${i}"/* .
            OS=`basename "${i}"`
            if [[ "$OS" == "windows" ]]; then
              zip -9 supercell-$OS.zip README supercell.exe
            else
              chmod +x supercell
              tar czvf supercell-$OS.tar.gz README supercell
            fi
            rm -f supercell supercell.exe
          done
          cp -afv supercell-* "${REPO_PATH}/${DEPLOY_DIR}/exe/."

          cd ${REPO_PATH}

          ls -lah

          # Commit the "changes", i.e. the new version.
          # The delta will show diffs between new and old version
          git add --no-ignore-removal .
          git status
          git commit -m "Deploy to GitHub Pages: ${GITHUB_SHA}"
          # Now that we're all set up, we can push.
          git push $DEPLOY_REPO $DEPLOY_BRANCH
