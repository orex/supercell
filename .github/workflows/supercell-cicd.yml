name: Build jobs
run-name:
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - '3rd_party/**'
  pull_request:
    branches:
      - master
  release:
    types: [published]

jobs:
  build-develop-linux:
    # One job per compiler: oldest/newest gcc and oldest/newest clang we
    # support, all on ubuntu-24.04. The aminya/setup-cpp action handles
    # PPA/apt.llvm.org plumbing and exports CC/CXX into $GITHUB_ENV for
    # subsequent steps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-11
          - compiler: gcc-16
          - compiler: clang-14
          - compiler: clang-22
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "500M"
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: "Install project deps"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-program-options-dev libboost-test-dev \
            libtbb-dev libarchive-dev libeigen3-dev \
            liblzma-dev libbz2-dev zlib1g-dev
      - name: "Setup C++ (${{ matrix.compiler }})"
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ccache: true
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # Per-compiler cache so gcc-11 doesn't pollute clang-22's entries.
          key: ccache-linux-${{ matrix.compiler }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.compiler }}-
      - name: "Configure & build"
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_DOC=OFF \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"
      - name: "Smoke test"
        run: 'build/src/sc_cli/supercell -d -i ./data/examples/Ca2Al2SiO7/Ca2Al2SiO7.cif | grep -q "The total number of combinations is 6"'
      - name: "Run unit tests"
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
      - name: "ccache stats"
        if: always()
        run: ccache -s
      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
  deploy-build-macos:
    strategy:
      fail-fast: false
    runs-on: macos-14
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: "Install brew dependencies"
        run: |
          brew install boost eigen libarchive zlib
      - name: "Get TBB"
        uses: actions/checkout@v5
        with:
          repository: uxlfoundation/oneTBB
          ref: v2023.0.0
          path: ./tbb
          submodules: true
      - name: "Compile and install tbb"
        working-directory: ./tbb
        run: |
          cmake . -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DTBB_TEST=OFF
          make -j "$(sysctl -n hw.ncpu)"
          sudo make install
      - uses: actions/checkout@v5
        with:
          path: ./supercell
          submodules: true
      - name: "Compile supercell and tests."
        working-directory: ./supercell
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig"
          cmake . -DCMAKE_BUILD_TYPE=Release -DLINK_STATIC_LIBS=ON -DLibArchive_INCLUDE_DIR=$(brew --prefix libarchive)/include
          make -j "$(sysctl -n hw.ncpu)"
      - name: "Check supercell"
        working-directory: ./supercell
        run: 'src/sc_cli/supercell -d -i ./data/examples/Ca2Al2SiO7/Ca2Al2SiO7.cif | grep -q "The total number of combinations is 6"'
      - name: "Run unit tests"
        working-directory: ./supercell
        run: ctest --output-on-failure -j "$(sysctl -n hw.ncpu)"
      - name: "Check supercell dynamic libs."
        working-directory: ./supercell
        run: 'otool -l src/sc_cli/supercell'
      - name: Upload Supercell
        uses: actions/upload-artifact@v7
        with:
          name: macos-bin
          path: ./supercell/src/sc_cli/supercell
  deploy-build-linux:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
      - name: "Clone supercell"
        uses: actions/checkout@v5
        with:
          path: ./supercell
          submodules: true
      - name: "Clone oneTBB"
        uses: actions/checkout@v5
        with:
          repository: uxlfoundation/oneTBB
          ref: v2023.0.0
          path: ./oneTBB
          submodules: true
      - name: "Compile supercell in Ubuntu 20.04 container"
        uses: addnab/docker-run-action@v3
        with:
          image: ubuntu:20.04
          options: -v ${{ github.workspace }}:/work
          run: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get full-upgrade -y
            apt-get install -y wget tar zip git cmake software-properties-common \
              libboost-program-options-dev libboost-test-dev \
              liblzma-dev libbz2-dev zlib1g-dev libzstd-dev liblz4-dev
            # gcc-14 from the toolchain PPA; libstdc++ stays Ubuntu 20.04-era,
            # so the glibc 2.31 floor is preserved.
            add-apt-repository -y ppa:ubuntu-toolchain-r/test
            apt-get update
            apt-get install -y gcc-14 g++-14
            export CC=gcc-14
            export CXX=g++-14
            export BASE_DIR=/work
            # Eigen 5.0.1
            cd $BASE_DIR
            wget -nv https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.gz -O - | tar -zxf -
            cmake -S eigen-5.0.1 -B eigen-build \
              -DEIGEN_BUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF \
              -DEIGEN_BUILD_BLAS=OFF -DEIGEN_BUILD_LAPACK=OFF
            cmake --install eigen-build
            # oneTBB
            cd $BASE_DIR/oneTBB
            cmake . -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DTBB_TEST=OFF
            make -j $(nproc) && make install
            # libarchive 3.8.7
            cd $BASE_DIR
            wget -nv https://github.com/libarchive/libarchive/releases/download/v3.8.7/libarchive-3.8.7.tar.gz -O - | tar -zxf -
            cd libarchive-3.8.7
            ./configure --without-openssl --without-libb2 --without-xml2 --without-expat --without-nettle --disable-bsdtar
            sed -ir '/^.*#define HAVE_LZMA_STREAM_ENCODER_MT 1.*$/d' config.h
            make -j $(nproc) && make install && ldconfig
            # supercell — apply AVX2 + LTO only to the project's own TUs;
            # oneTBB and libarchive above were built without these flags.
            # LEGACY_GLIBC_EXP redirects libm exp() to its glibc 2.2.5 symbol
            # so the deploy binary loads on pre-glibc-2.29 hosts (RHEL 8,
            # Ubuntu 18.04, Debian 10, Leap 15.x).
            cd $BASE_DIR/supercell
            cmake . -DCMAKE_BUILD_TYPE=Release -DLINK_STATIC_LIBS=ON -DBUILD_DOC=OFF \
              -DLEGACY_GLIBC_EXP=ON \
              -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -march=x86-64-v3 -flto=auto" \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -march=x86-64-v3 -flto=auto" \
              -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-flto=auto"
            # Build the full target set (supercell + unit tests) so the same
            # deploy-flags binary that we ship is also exercised by ctest.
            make -j $(nproc)
            src/sc_cli/supercell -d -i data/examples/Ca2Al2SiO7/Ca2Al2SiO7.cif | grep -q "The total number of combinations is 6"
            echo "=== testing stage ==="
            ctest --output-on-failure -j $(nproc)
      - name: Upload Supercell
        uses: actions/upload-artifact@v7
        with:
          name: linux-bin
          path: ./supercell/src/sc_cli/supercell
  deploy-build-windows:
    runs-on: ubuntu-22.04
    steps:
      - name: "Install dependencies"
        run: |
          sudo apt update && sudo apt -y full-upgrade
          sudo apt install -y gcc cmake build-essential wine-stable autopoint gperf intltool libtool libtool-bin lzip p7zip-full python3 python3-mako
      - name: "Download MXE"
        uses: actions/checkout@v5
        with:
          repository: mxe/mxe
          path: ./mxe
          submodules: true
      - name: Cache
        uses: actions/cache@v4
        with:
          save-always: true
          path: ./mxe/.ccache
          key: win-cache-${{ github.run_id }} # Can use time based key as well
          restore-keys: |
            win-cache-          
      - name: "Compile MXE"
        working-directory: ./mxe
        run: |
          sed -i -r 's/ nettle / /g' src/libarchive.mk && sed -i -r 's/with-nettle/without-nettle --without-openssl --without-iconv /g' src/libarchive.mk
          make MXE_TARGETS=x86_64-w64-mingw32.static MXE_PLUGIN_DIRS=plugins/gcc14 ccache
          echo 'max_size = 15.0G' > .ccache/ccache/ccache.conf
          .ccache/bin/ccache -s 
          make MXE_TARGETS=x86_64-w64-mingw32.static MXE_PLUGIN_DIRS=plugins/gcc14 ccache cc cmake onetbb boost eigen libarchive --jobs=4 JOBS=4
          .ccache/bin/ccache -s
          echo "${PWD}/usr/bin" >> $GITHUB_PATH
      - name: "Clone supercell"
        uses: actions/checkout@v5
        with:
          path: ./supercell
          submodules: true
      - name: "Compile Supercell and tests"
        working-directory: ./supercell
        run: |
          x86_64-w64-mingw32.static-cmake . -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_DOC=OFF -DLINK_STATIC_LIBS=ON -DCMAKE_CROSSCOMPILING_EMULATOR=wine
          make
      - name: "Run supercell"
        working-directory: ./supercell
        run: 'wine src/sc_cli/supercell.exe -d -i ./data/examples/Ca2Al2SiO7/Ca2Al2SiO7.cif | grep -q "The total number of combinations is 6"'
      - name: "Run unit tests under wine"
        working-directory: ./supercell
        run: ctest --output-on-failure -j 4
      - name: Upload Supercell
        uses: actions/upload-artifact@v7
        with:
          name: windows-bin
          path: ./supercell/src/sc_cli/supercell.exe

  deploy-to-site:
    if: github.event_name == 'release'
    needs: [ deploy-build-linux, deploy-build-macos, deploy-build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: "Install dependencies"
        run: |
          sudo apt-get update && sudo apt-get full-upgrade -y
          sudo apt-get update
          sudo apt-get install -y git wget tar openssh-client zip
      - uses: actions/download-artifact@v7
        with:
          name: linux-bin
          path: ./art/linux
      - uses: actions/download-artifact@v7
        with:
          name: windows-bin
          path: ./art/windows
      - uses: actions/download-artifact@v7
        with:
          name: macos-bin
          path: ./art/osx
      - name: "Deploy to file"
        env:
          SITE_REPO_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir ./site && cd ./site
          # Save some useful information
          ART_DIR=${PWD}/../art/
          DEPLOY_REPO="git@github.com:orex/orex.github.io.git"
          DEPLOY_BRANCH="master"
          DEPLOY_DIR="supercell/external"
          #
          mkdir ~/.ssh
          eval `ssh-agent -s`
          echo "${SITE_REPO_KEY}" | ssh-add -
          ssh-keyscan -t rsa github.com > ~/.ssh/known_hosts
          # Clone the existing gh-pages for this repo into out/
          # Create a new empty branch if gh-pages doesn't exist yet (should only happen on first deply)
          git clone --recurse-submodules "${DEPLOY_REPO}" --branch "${DEPLOY_BRANCH}" out && cd out
          REPO_PATH=${PWD}
          # Now let's go have some fun with the cloned repo
          git config user.name "Github Action"
          git config user.email "kirill.okhotnikov@gmail.com"
          #Main code
          mkdir -p "${REPO_PATH}/${DEPLOY_DIR}/exe/."
          cd `mktemp -d -t XXXXXX`
          wget -nv https://github.com/orex/supercell/raw/deploy/README -O README
          for i in ${ART_DIR}/*
          do
            cp -a "${i}"/* .
            OS=`basename "${i}"`
            if [[ "$OS" == "windows" ]]; then
              zip -9 supercell-$OS.zip README supercell.exe
            else
              chmod +x supercell
              tar czvf supercell-$OS.tar.gz README supercell
            fi
            rm -f supercell supercell.exe
          done
          cp -afv supercell-* "${REPO_PATH}/${DEPLOY_DIR}/exe/."

          cd ${REPO_PATH}

          ls -lah

          # Commit the "changes", i.e. the new version.
          # The delta will show diffs between new and old version
          git add --no-ignore-removal .
          git status
          git commit -m "Deploy to GitHub Pages: ${GITHUB_SHA}"
          # Now that we're all set up, we can push.
          git push $DEPLOY_REPO $DEPLOY_BRANCH
